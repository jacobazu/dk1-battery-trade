# one-off: download the reserve prices and save the backtest on this branch (removed before merging)
name: reserves (once)
on:
  push:
    branches: [reserves]
    paths: [reserves.py, .github/workflows/reserves-once.yml]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests numpy
      - run: python reserves.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/reserves_daily.csv
          git commit -m "reserves backtest" && git push
