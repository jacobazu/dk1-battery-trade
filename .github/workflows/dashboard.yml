name: dashboard

on:
  schedule:
    - cron: "7 10 * * *"   # 10:07 UTC, after the price repo has saved tomorrow's forecast
    # afternoon: nord pool publishes tomorrow's prices about 13:00 danish time, so the plan can be shown at them
    - cron: "20 12 * * *"
    - cron: "20 13 * * *"
    - cron: "20 14 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # a failed run sends no email: it runs many times a day and one flaky run (an apt mirror, a late data feed)
  # is not a failure. the watchdog in dk1-price-forecasting checks the output and emails when it is missing
  build:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest
      - run: python dashboard.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    continue-on-error: true
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4